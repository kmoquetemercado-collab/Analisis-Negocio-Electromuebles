<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Electromuebles | Diagramas DEA, DERE y DER</title>
<style>
:root{--navy:#12385b;--blue:#1d6fa5;--sky:#eaf4fb;--line:#315b78;--gold:#d99519;--green:#e8f6ed;--red:#fff0f0;--ink:#1d2935;--muted:#607384;--paper:#fff;--bg:#eef3f7}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Arial,Helvetica,sans-serif}.cover{min-height:100vh;display:grid;place-items:center;text-align:center;color:#fff;background:linear-gradient(135deg,#0d2b49,#1b6d9e);padding:40px;page-break-after:always}.cover h1{font-size:clamp(2.2rem,6vw,4.5rem);margin:0 0 12px;letter-spacing:.04em}.cover h2{font-size:clamp(1.2rem,3vw,2rem);font-weight:400;margin:0}.cover .rule{width:90px;height:4px;background:#f4c45d;margin:30px auto;border-radius:4px}.cover p{font-size:1.08rem}.wrap{max-width:1500px;margin:auto;padding:28px 22px 70px}.intro,.category{background:var(--paper);border:1px solid #d8e2ea;border-radius:14px;box-shadow:0 3px 12px #18344a12;padding:24px;margin-bottom:24px}.intro h2,.category>h2{color:var(--navy);margin:0 0 12px}.intro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.key{padding:15px;border-radius:10px;background:var(--sky);border-left:4px solid var(--blue)}.category{page-break-before:always}.category:first-of-type{page-break-before:auto}.category>h2{border-bottom:3px solid var(--sky);padding-bottom:12px;font-size:1.55rem}.entity{border:1px solid #d3dfe8;border-left:6px solid var(--blue);border-radius:10px;margin:22px 0;padding:16px;background:#fbfdff;page-break-inside:avoid}.entity-title{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;color:var(--navy);font-size:1.2rem;font-weight:700;margin-bottom:12px}.tag{font-size:.72rem;border-radius:15px;padding:4px 9px;background:var(--green);color:#176238}.tag.weak{background:var(--red);color:#a21e1e}.flow{display:grid;grid-template-columns:minmax(130px,1fr) 55px minmax(230px,1.8fr) 55px minmax(130px,1fr);align-items:center;gap:8px;margin:12px 0 15px}.box{background:#fff;border:2px solid var(--line);border-radius:9px;padding:12px;text-align:center;min-height:85px;box-shadow:0 2px 5px #163b5214}.box strong{display:block;color:var(--navy);font-size:1rem;margin-bottom:6px}.box small{display:block;color:var(--muted)}.main{background:#f7fbff;border-color:var(--blue)}.relation{text-align:center;color:var(--gold);font-weight:bold;font-size:1.35rem}.relation small{display:block;font-size:.72rem;color:var(--muted);font-weight:normal}.attributes{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:10px}.attr{border:1px solid #b9cbd8;border-radius:15px;background:#fff;padding:4px 9px;font-size:.78rem}.pk{color:#7b4d00;border-color:#e5bd66;background:#fff8e8}.fk{color:#14527c;background:#edf7ff}.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.82rem;border-top:1px solid #e3ebf1;padding-top:10px}.legend b{color:var(--navy)}.note{font-size:.87rem;color:var(--muted);margin:8px 0 0}.summary{background:linear-gradient(135deg,#12385b,#1d6fa5);color:#fff;border-radius:14px;padding:35px;text-align:center;page-break-before:always}.summary h2{font-size:2rem}.footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:30px}@media(max-width:800px){.intro-grid{grid-template-columns:1fr}.flow{grid-template-columns:1fr;gap:5px}.relation{transform:rotate(90deg);height:30px}.box{min-height:65px}}@media print{body{background:#fff}.wrap{padding:0}.intro,.category{box-shadow:none}.cover{min-height:100vh}.entity{break-inside:avoid}.category{break-before:page}.summary{break-before:page}}
</style>
</head>
<body>
<section class="cover"><div><h1>ELECTROMUEBLES</h1><h2>Diagramas de flujo visuales DEA, DERE y DER</h2><div class="rule"></div><p>Base de Datos II</p><p>46 dominios organizados en 8 categorías</p><p>Documento listo para imprimir o guardar como PDF</p></div></section>
<main class="wrap" id="app"></main>
<script>
const C=[
['1','Administración, Ubicación y Seguridad',[
['Sucursal','fuerte',['id_sucursal','nombre','direccion','telefono','id_ciudad'],'Ciudad','contiene','1:N'],
['Ciudad','fuerte',['id_ciudad','nombre','id_provincia'],'Provincia','pertenece a','1:N'],
['Usuario','fuerte',['id_usuario','nombre','email','rol'],'Sucursal','trabaja en','N:1'],
['Provincia','fuerte',['id_provincia','nombre'],'Ciudad','contiene','1:N']]],
['2','Recursos Humanos y Personal',[
['Cargo','fuerte',['id_cargo','nombre','descripcion'],'Empleado','define','1:N'],
['Empleado','fuerte',['id_empleado','nombre','apellido','cedula','salario_base','id_cargo','id_sucursal'],'Cargo / Sucursal','ocupa / trabaja en','N:1'],
['Vendedor','weak',['id_vendedor','id_empleado','comision','meta_ventas'],'Empleado','es especializado en','1:1'],
['Nómina','weak',['id_nomina','id_empleado','periodo','sueldo_neto','fecha_pago'],'Empleado','recibe','N:1'],
['Descuento de nómina','weak',['id_descuento_nomina','id_nomina','concepto','monto'],'Nómina','incluye','N:1'],
['Impuesto de nómina','weak',['id_impuesto_nomina','id_nomina','tipo_impuesto','monto'],'Nómina','aplica','N:1'],
['Departamento nómina','fuerte',['id_departamento_nomina','nombre','descripcion'],'Empleado','organiza','1:N']]],
['3','Catálogo e Inventario',[
['Categoría','fuerte',['id_categoria','nombre','descripcion'],'Producto','clasifica','1:N'],
['Marca','fuerte',['id_marca','nombre','origen'],'Producto','produce','1:N'],
['Producto','fuerte',['id_producto','nombre','descripcion','precio_unitario','stock_minimo','id_marca','id_categoria','id_unidad_producto'],'Marca / Categoría / Unidad','pertenece / clasifica / mide','N:1'],
['Unidad de producto','fuerte',['id_unidad_producto','nombre','abreviatura'],'Producto','mide','1:N'],
['Almacén','fuerte',['id_almacen','nombre','direccion','id_sucursal'],'Sucursal','pertenece a','N:1'],
['Transferencia de almacenes','weak',['id_transferencia','id_almacen_origen','id_almacen_destino','fecha','estado'],'Almacén / Producto','mueve / participa','N:M'],
['Grupo de producto','fuerte',['id_grupo_producto','nombre'],'Producto','agrupa','1:N'],
['Departamento de producto','fuerte',['id_departamento_producto','nombre','descripcion'],'Producto','organiza','1:N']]],
['4','Ventas, Facturación y Despacho',[
['Cliente','fuerte',['id_cliente','nombre','cedula_ruc','telefono','email','id_ciudad'],'Factura / Cotización','genera / solicita','1:N'],
['Cotización','weak',['id_cotizacion','id_cliente','id_vendedor','fecha','subtotal','iva'],'Cliente / Vendedor','solicita / atiende','N:1'],
['Factura','weak',['id_factura','id_cliente','id_sucursal','id_usuario','fecha','total','estado'],'Cliente','genera','N:1'],
['Devolución de factura','weak',['id_devolucion_factura','id_factura','fecha','motivo','monto'],'Factura','devuelve','N:1'],
['Entrega a domicilio','weak',['id_entrega_domicilio','id_factura','direccion','fecha_envio','estado'],'Factura','entrega','1:1']]],
['5','Compras y Proveedores',[
['Proveedor','fuerte',['id_proveedor','nombre','ruc','telefono','email','id_ciudad'],'Compra / Orden de compra','abastece / recibe','1:N'],
['Orden de compra','weak',['id_orden_compra','id_proveedor','id_usuario','fecha','total'],'Proveedor','solicita','N:1'],
['Compra','weak',['id_compra','id_orden_compra','id_proveedor','fecha','total'],'Proveedor / Orden de compra','registra / convierte','N:1'],
['Devolución de compra','weak',['id_devolucion_compra','id_compra','motivo','fecha','monto'],'Compra','devuelve','N:1']]],
['6','Cuentas por Cobrar y Cuentas por Pagar',[
['Cuentas por cobrar','weak',['id_cuenta_cobrar','id_cliente','id_factura','monto','fecha_vencimiento','estado'],'Cliente / Factura','debe / origina','N:1'],
['Nota de crédito cuentas por cobrar','weak',['id_nota_credito_cxc','id_cuenta_cobrar','concepto','monto','fecha'],'Cuentas por cobrar','ajusta crédito','N:1'],
['Nota de débito cuentas por cobrar','weak',['id_nota_debito_cxc','id_cuenta_cobrar','concepto','monto','fecha'],'Cuentas por cobrar','ajusta débito','N:1'],
['Cuentas por pagar','weak',['id_cuenta_pagar','id_proveedor','id_compra','monto','fecha_vencimiento','estado'],'Proveedor / Compra','se debe / origina','N:1'],
['Nota de crédito cuentas por pagar','weak',['id_nota_credito_cxp','id_cuenta_pagar','concepto','monto','fecha'],'Cuentas por pagar','ajusta crédito','N:1'],
['Nota de débito cuentas por pagar','weak',['id_nota_debito_cxp','id_cuenta_pagar','concepto','monto','fecha'],'Cuentas por pagar','ajusta débito','N:1']]],
['7','Caja y Efectivo (Punto de Venta)',[
['Caja','fuerte',['id_caja','nro_caja','id_sucursal','estado'],'Apertura de caja','abre','1:N'],
['Apertura de caja','weak',['id_apertura_caja','id_caja','id_usuario','fecha_apertura','monto_inicial'],'Caja','inicia','N:1'],
['Cierre de caja','weak',['id_cierre_caja','id_apertura_caja','fecha_cierre','monto_final','diferencia'],'Apertura de caja','termina','1:1'],
['Recibo de ingreso','weak',['id_recibo_ingreso','id_apertura_caja','concepto','monto','fecha'],'Apertura de caja','registra','N:1']]],
['8','Gestión Bancaria y Tesorería',[
['Banco','fuerte',['id_banco','nombre','codigo_banco'],'Cuenta bancaria','posee','1:N'],
['Cuenta bancaria','fuerte',['id_cuenta_bancaria','id_banco','id_sucursal','numero_cuenta','tipo_cuenta'],'Banco','administra','N:1'],
['Depósito','weak',['id_deposito','id_cuenta_bancaria','fecha','monto','concepto'],'Cuenta bancaria','recibe','N:1'],
['Cheque','weak',['id_cheque','id_cuenta_bancaria','numero_cheque','beneficiario','monto','fecha'],'Cuenta bancaria','emite','N:1'],
['Transferencia bancaria','weak',['id_transferencia_bancaria','id_cuenta_origen','id_cuenta_destino','monto','fecha','concepto'],'Cuenta bancaria','transfiere','N:M'],
['Nota de débito bancaria','weak',['id_nota_debito_bancaria','id_cuenta_bancaria','monto','concepto','fecha'],'Cuenta bancaria','disminuye','N:1'],
['Nota de crédito bancaria','weak',['id_nota_credito_bancaria','id_cuenta_bancaria','monto','concepto','fecha'],'Cuenta bancaria','aumenta','N:1'],
['Conciliación bancaria','weak',['id_conciliacion_bancaria','id_cuenta_bancaria','periodo','saldo_libro','saldo_banco','diferencia'],'Cuenta bancaria','concilia','1:1']]]
];
function slug(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').toLowerCase()}
function attr(a){let cls=a.startsWith('id_')?'pk':(a.includes('fk')||a.includes('origen')||a.includes('destino'))?'fk':'';return `<span class="attr ${cls}">${a}${cls==='pk'?' · PK':cls==='fk'?' · FK':''}</span>`}
function entity(d){let [name,type,attrs,parent,rel,card]=d;let weak=type==='weak';let p=parent.split(' / ')[0];return `<article class="entity" id="${slug(name)}"><div class="entity-title"><span>${name}</span><span class="tag ${weak?'weak':''}">${weak?'ENTIDAD DÉBIL':'ENTIDAD FUERTE'}</span></div><div class="flow"><div class="box"><strong>${p}</strong><small>entidad relacionada</small></div><div class="relation">→<small>${rel}</small></div><div class="box main"><strong>${name}</strong><small>diagrama DEA: atributos</small><div class="attributes">${attrs.map(attr).join('')}</div></div><div class="relation">${card}<small>cardinalidad</small></div><div class="box"><strong>${parent}</strong><small>relación directa</small></div></div><div class="legend"><span><b>DEA:</b> caja central con atributos</span><span><b>DERE:</b> fuerza, relación y dependencia</span><span><b>DER:</b> cardinalidad ${card}</span></div><p class="note">${name} ${weak?'depende de':'se relaciona con'} ${parent}. La PK aparece en dorado y las FK en azul.</p></article>`}
let app=document.getElementById('app');app.innerHTML=`<section class="intro"><h2>Guía de lectura</h2><p>Esta versión sigue el formato solicitado: cada dominio tiene su propio diagrama visual en orden dentro de su categoría. La caja central representa el dominio; los atributos corresponden al DEA; la relación, la fuerza/debilidad y la cardinalidad corresponden al DERE/DER.</p><div class="intro-grid"><div class="key"><b>DEA</b><br>Atributos, PK y FK del dominio.</div><div class="key"><b>DERE</b><br>Entidad fuerte o débil, relación directa y dependencia.</div><div class="key"><b>DER</b><br>Cardinalidad 1:1, 1:N o N:M.</div></div><p><b>Nota:</b> Las flechas se leen desde la entidad relacionada hacia el dominio central. En impresión, usa orientación vertical y escala “predeterminada”.</p></section>`;C.forEach(c=>{let [n,title,items]=c;app.innerHTML+=`<section class="category"><h2>Categoría ${n}: ${title}</h2>${items.map(entity).join('')}</section>`});app.innerHTML+=`<section class="summary"><h2>Conclusión</h2><p>El negocio de Electromuebles queda organizado en 8 categorías y 46 dominios. Cada dominio posee un diagrama visual individual, con sus atributos, claves, relación directa, clasificación fuerte/débil y cardinalidad. Este modelo sirve como base para derivar las tablas de la base de datos.</p><p><b>Resultado:</b> ${C.reduce((a,c)=>a+c[2].length,0)} diagramas ordenados para la entrega de Base de Datos II.</p></section><div class="footer">Electromuebles · Base de Datos II · Documento académico</div>`;
</script>
</body>
</html>
